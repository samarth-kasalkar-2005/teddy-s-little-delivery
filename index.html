<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teddy's Little Delivery 🧸💌</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- ========================= -->
    <!-- LOADER -->
    <!-- ========================= -->

    <div id="loader">

        <div class="loader-card">

            <h2>🧸</h2>

            <p>Packing your surprise...</p>

            <div class="loader-bar">

                <div class="loader-progress"></div>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- BACKGROUND -->
    <!-- ========================= -->

    <div class="sky">

        <div class="sun"></div>

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div id="hearts"></div>

    </div>

    <!-- ========================= -->
    <!-- MAIN STORY -->
    <!-- ========================= -->

    <section id="scene">

        <!-- Teddy -->

        <img
            id="teddy"
            class="teddy"
            src="assets/teddy.png"
            alt="Teddy">

        <!-- Speech -->

        <div id="speech"
             class="speech hidden">

            <span id="typing"></span>

        </div>

        <!-- Envelope -->

        <div id="envelope"
             class="hidden">

            <img
                src="assets/envelope.png"
                alt="Envelope">

        </div>

    </section>

    <!-- ========================= -->
    <!-- LETTER -->
    <!-- ========================= -->

    <section
        id="letter"
        class="hidden">

        <div class="letter-card">

            <h2>💌</h2>

            <h3>A Letter For You</h3>

            <p>

                Dear You,

                <br><br>

                It's been a while...

                <br><br>

                I hope this tiny surprise
                makes you smile today.

                <br><br>

                ❤️

            </p>

            <button id="startBtn">

                Open Memories

            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- GALLERY -->
    <!-- ========================= -->

    <section
        id="gallery"
        class="hidden">

        <div class="gallery-card">

            <div class="polaroid">

                <img
                    id="memoryPhoto"
                    src=""
                    alt="Memory">

            </div>

            <p id="memoryText"></p>

            <button id="nextBtn">

                Next Memory ❤️

            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- ENDING -->
    <!-- ========================= -->

    <section
        id="ending"
        class="hidden">

        <div class="ending-card">

            <img
                src="assets/teddy.png"
                class="ending-teddy"
                alt="Teddy">

            <h2>

                Thank You ❤️

            </h2>

            <p>

                It's been a while...

                <br><br>

                I just wanted to make
                you smile today.

                <br><br>

                Take care of yourself.

                <br><br>

                🧸❤️

            </p>

            <button
                onclick="location.reload()">

                Watch Again

            </button>

        </div>

    </section>

    <!-- Optional Music -->

    <!--
    <audio id="music" loop>

        <source
            src="assets/music.mp3"
            type="audio/mpeg">

    </audio>
    -->

    <script src="script.js"></script>

</body>

</html>
